[project]
name = "elt"
version = "0.1.0"
description = "Framework generico de ELT com tabela de controle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.50.0",
    "google-api-python-client>=2.130.0",
    "gspread>=6.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.49",
    "requests>=2.34.2",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
    "minio>=7.1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
